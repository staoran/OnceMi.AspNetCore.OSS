name: CI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: "Publish packages to NuGet after build, test, and pack"
        required: false
        default: false
        type: boolean
      package_core:
        description: "Package EasyLink.Storage"
        required: false
        default: true
        type: boolean
      package_minio:
        description: "Package EasyLink.Storage.Minio"
        required: false
        default: true
        type: boolean
      package_aliyunoss:
        description: "Package EasyLink.Storage.AliyunOSS"
        required: false
        default: true
        type: boolean
      package_aliyunossv2:
        description: "Package EasyLink.Storage.AliyunOSSV2"
        required: false
        default: true
        type: boolean
      package_tencentcos:
        description: "Package EasyLink.Storage.TencentCOS"
        required: false
        default: true
        type: boolean
      package_qiniukodo:
        description: "Package EasyLink.Storage.QiniuKodo"
        required: false
        default: true
        type: boolean
      package_huaweiobs:
        description: "Package EasyLink.Storage.HuaweiOBS"
        required: false
        default: true
        type: boolean
      package_baidubos:
        description: "Package EasyLink.Storage.BaiduBOS"
        required: false
        default: true
        type: boolean
      package_ctyunoos:
        description: "Package EasyLink.Storage.CtyunOOS"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: src/EasyLink.Storage.sln
  PACKAGE_PROJECT_PATH: src/src/EasyLink.Storage/EasyLink.Storage.csproj
  PACKAGE_OUTPUT: artifacts/packages
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          package_version="$(dotnet msbuild "${{ env.PACKAGE_PROJECT_PATH }}" -getProperty:Version -nologo)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag version '$tag_version' does not match package version '$package_version'." >&2
            exit 1
          fi

      - name: Pack NuGet packages
        shell: bash
        run: |
          projects=()

          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_core }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage/EasyLink.Storage.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_minio }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.Minio/EasyLink.Storage.Minio.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_aliyunoss }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.AliyunOSS/EasyLink.Storage.AliyunOSS.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_aliyunossv2 }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.AliyunOSSV2/EasyLink.Storage.AliyunOSSV2.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_tencentcos }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.TencentCOS/EasyLink.Storage.TencentCOS.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_qiniukodo }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.QiniuKodo/EasyLink.Storage.QiniuKodo.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_huaweiobs }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.HuaweiOBS/EasyLink.Storage.HuaweiOBS.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_baidubos }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.BaiduBOS/EasyLink.Storage.BaiduBOS.csproj)
          fi
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.package_ctyunoos }}" == "true" ]]; then
            projects+=(src/src/EasyLink.Storage.CtyunOOS/EasyLink.Storage.CtyunOOS.csproj)
          fi

          if [ ${#projects[@]} -eq 0 ]; then
            echo "Select at least one package to pack." >&2
            exit 1
          fi

          for project in "${projects[@]}"; do
            dotnet pack "$project" --configuration Release --no-build --no-restore --output "${{ env.PACKAGE_OUTPUT }}"
          done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ env.PACKAGE_OUTPUT }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT }}/*.snupkg
          if-no-files-found: error

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-test-pack
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget)
    environment: nuget-production
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_USER: ${{ vars.NUGET_USER || 'taoran' }}

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Require NuGet username
        shell: bash
        run: |
          if [ -z "${{ env.NUGET_USER }}" ]; then
            echo "NUGET_USER is required for NuGet Trusted Publishing." >&2
            exit 1
          fi

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push package
        shell: bash
        run: |
          shopt -s nullglob
          packages=("${{ env.PACKAGE_OUTPUT }}"/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files found in ${{ env.PACKAGE_OUTPUT }}." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source "${{ env.NUGET_SOURCE }}" \
              --skip-duplicate
          done
